</g>
<rect x=".5" y=".5" width="289" height="139" rx="14" fill="none" stroke="#22346b"/>
<g transform="translate(256 34)"><circle r="10" fill="#b8a9ff"/><ellipse rx="18" ry="5" fill="none" stroke="#ff8fc8" stroke-width="1.3" transform="rotate(-18)"><animateTransform attributeName="transform" type="rotate" values="-18;-8;-18" dur="6s" repeatCount="indefinite"/></ellipse></g>
