cle cx="65.1" cy="139.3" r="0.4" fill="#ffd1ea" class="tw" style="animation-duration:6s;animation-delay:-4.7s"/><circle cx="194.7" cy="65.5" r="1.6" fill="#c9d6ff" class="tw" style="animation-duration:5.4s;animation-delay:-2.7s"/><circle cx="78.8" cy="80.3" r="0.5" fill="#b8a9ff" class="tw" style="animation-duration:5.4s;animation-delay:-0.1s"/><circle cx="175.2" cy="127.4" r="0.4" fill="#ffffff" class="tw" style="animation-duration:4.8s;animation-delay:-4.3s"/><circle cx="131.9" cy="23.6" r="0.4" fill="#ffd1ea" class="tw" style="animation-duration:5s;animation-delay:-1s"/>
