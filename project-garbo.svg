<radialGradient id="blob"><stop offset="0" stop-color="#b8a9ff" stop-opacity=".18"/><stop offset="1" stop-color="#b8a9ff" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="290" height="140" rx="14"/></clipPath>
</defs>
