</g>
<rect x=".5" y=".5" width="289" height="139" rx="14" fill="none" stroke="#22346b"/>
<g transform="translate(256 34)"><g><animateTransform attributeName="transform" type="translate" values="3 -2;-3 2;3 -2" dur="5s" repeatCount="indefinite"/><line x1="4" y1="-4" x2="20" y2="-14" stroke="#ff8fc8" stroke-width="2" stroke-linecap="round" opacity=".45"/><circle r="4.5" fill="#ff8fc8"/></g></g>
