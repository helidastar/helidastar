</g>
<rect x=".5" y=".5" width="289" height="139" rx="14" fill="none" stroke="#22346b"/>
<g transform="translate(256 34)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/><circle cx="-7" r="5.5" fill="#b8a9ff"/><circle cx="9" r="3.5" fill="#ff8fc8"/></g></g>
