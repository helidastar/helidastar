<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 140" width="290" height="140">
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.small{font-size:12px}
.ptitle{font:italic 20px Georgia,'Times New Roman',serif;fill:#eef2ff}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.in{animation:in 1s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1433"/><stop offset="1" stop-color="#070b1f"/></linearGradient>
<radialGradient id="blob"><stop offset="0" stop-color="#ff8fc8" stop-opacity=".18"/><stop offset="1" stop-color="#ff8fc8" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="290" height="140" rx="14"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="290" height="140" fill="url(#bg)"/>
<ellipse cx="250" cy="30" rx="110" ry="70" fill="url(#blob)"/>
<circle cx="255.8" cy="64.3" r="0.4" fill="#ffffff" class="tw" style="animation-duration:4.4s;animation-delay:-5.8s"/><circle cx="47.9" cy="63.7" r="1.7" fill="#ffd1ea" class="tw" style="animation-duration:4.2s;animation-delay:-5.1s"/><circle cx="50" cy="62" r="0.6" fill="#c9d6ff" class="tw" style="animation-duration:2.6s;animation-delay:-2.5s"/><circle cx="213.3" cy="31" r="0.5" fill="#b8a9ff" class="tw" style="animation-duration:5.6s;animation-delay:-2.3s"/><circle cx="234.1" cy="40" r="0.8" fill="#ffffff" class="tw" style="animation-duration:2.8s;animation-delay:-0.2s"/><circle cx="73.1" cy="112" r="1.5" fill="#ffd1ea" class="tw" style="animation-duration:3.3s;animation-delay:-5.2s"/><circle cx="187.1" cy="17.2" r="0.9" fill="#c9d6ff" class="tw" style="animation-duration:4.5s;animation-delay:-1.7s"/><circle cx="183.4" cy="82.9" r="0.6" fill="#b8a9ff" class="tw" style="animation-duration:4.6s;animation-delay:-2.1s"/><circle cx="270.7" cy="134" r="0.5" fill="#ffffff" class="tw" style="animation-duration:3.1s;animation-delay:-1.3s"/><circle cx="186" cy="33.7" r="0.7" fill="#ffd1ea" class="tw" style="animation-duration:2.5s;animation-delay:-1.5s"/><circle cx="153.1" cy="131.6" r="0.4" fill="#c9d6ff" class="tw" style="animation-duration:5.7s;animation-delay:-5.4s"/><circle cx="96.2" cy="126.7" r="0.7" fill="#b8a9ff" class="tw" style="animation-duration:5.5s;animation-delay:-4.7s"/><circle cx="245.2" cy="16.6" r="0.5" fill="#ffffff" class="tw" style="animation-duration:3.9s;animation-delay:-0.1s"/><circle cx="260.1" cy="99.3" r="0.5" fill="#ffd1ea" class="tw" style="animation-duration:3.2s;animation-delay:-3s"/><circle cx="278.4" cy="34.3" r="0.4" fill="#c9d6ff" class="tw" style="animation-duration:4.1s;animation-delay:-1.9s"/><circle cx="193.6" cy="51.2" r="1.3" fill="#b8a9ff" class="tw" style="animation-duration:6.5s;animation-delay:-4.5s"/><circle cx="238.7" cy="17.6" r="0.7" fill="#ffffff" class="tw" style="animation-duration:6s;animation-delay:-0.4s"/><circle cx="