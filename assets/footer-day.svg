<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110">
<style>
.tw{animation-name:tw;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.dr1{animation-name:tw,dr1}.dr2{animation-name:tw,dr2}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes dr1{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-4px)}}
@keyframes dr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,3px)}}
.shoot{animation:shoot 8s linear infinite;opacity:0}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}10%{transform:translate(-460px,210px);opacity:0}100%{transform:translate(-460px,210px);opacity:0}}
.moon{animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.glow{animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
.draw{stroke-dasharray:420;animation:draw 10s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:420;opacity:0}15%{opacity:.6}45%,75%{stroke-dashoffset:0;opacity:.6}100%{stroke-dashoffset:0;opacity:0}}
.fade{animation:fade 1.6s ease-out both}
.fade2{animation:fade 1.6s .6s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
